<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário</title>
<style>
:root{--bg:#050b1a;--surf:#0e1830;--solid:#0e1830;--glow:rgba(47,123,255,.45);--ink:#f1f5ff;--mut:#9fb0d0;--line:#1c2a4a;--acc:#2f7bff;--accink:#fff;--wash:#11265a;--danger:#ff8a80;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef2fa;--surf:#fff;--ink:#0f1a33;--mut:#5b6b8c;--line:#d9e1f0;--acc:#1f6bff;--accink:#fff;--wash:#e4edff;--danger:#b3261e;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 12px 170px}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
h1{flex:1;min-width:0;margin:0;font-size:1.15rem;font-weight:700;letter-spacing:-.01em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:1rem;margin:20px 0 8px;font-weight:700}
.ib{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surf);border-radius:12px;font-size:1.4rem;line-height:1}
.hoje{height:44px;padding:0 14px;border:0;background:var(--wash);color:var(--acc);border-radius:12px;font-weight:600}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:.78rem;color:var(--mut);padding:4px 0}
.grid{gap:3px}
.cell{border:0;background:none;min-height:54px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.out{opacity:.35}
.cell .n{font-size:1rem;font-weight:500;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.cell.today .n{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}
.cell.sel .n{background:var(--acc);color:var(--accink);box-shadow:0 4px 14px var(--glow)}
.dots{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots b{font-size:.62rem;color:var(--mut);font-weight:600}
ul{list-style:none;margin:0;padding:2px 14px;display:grid;background:var(--surf);border:1px solid var(--line);border-radius:18px}
li+li{border-top:1px solid var(--line)}
.ev{width:100%;text-align:left;display:flex;gap:12px;border:0;background:none;padding:10px 0;min-height:62px}
.bar{width:6px;border-radius:4px;flex:none}
.tm{min-width:50px;font-size:1.02rem;font-weight:500;align-self:center}
.bd{display:flex;flex-direction:column;flex:1;min-width:0}
.chev{align-self:center;color:var(--mut);font-size:1.5rem}
.cp{margin-top:4px}
.ev .t{font-weight:600}
.ev .m{font-size:.85rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 10px}
.ev.x .t{text-decoration:line-through;color:var(--mut)}
.chip{font-size:.74rem;padding:1px 8px;border-radius:99px;background:var(--wash);color:var(--acc);font-weight:600}
.chip.u{background:var(--danger);color:var(--bg)}
.empty{color:var(--mut);font-size:.92rem;padding:8px 2px}
#fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:2.1rem;line-height:1;box-shadow:0 8px 22px var(--glow);z-index:10}
.ov{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.sheet{background:var(--solid);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
input[type=color]{padding:2px;height:44px}
input[type=checkbox]{width:22px;height:22px;min-height:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--ink);font-size:1rem}
.chk input{width:22px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:0 14px}
.acts .p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.acts .d{color:var(--danger)}
#err{color:var(--danger);font-size:.9rem;margin-top:10px;min-height:1.2em}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:30;max-width:90%}
#toast[hidden]{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.tabs button{border:0;background:none;border-radius:9px;min-height:40px;font-size:.86rem;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--accink)}
.wh,.adr{display:grid}
.wh button{border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:4px 0;min-height:44px}
.wh small{font-size:.72rem;color:var(--mut)}
.wh b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:.95rem}
.wh .today b{background:var(--acc);color:var(--accink)}
.wh .sel small{color:var(--acc);font-weight:700}
.adr{border-top:1px solid var(--line);padding:4px 0}
.adr .lab{font-size:.68rem;color:var(--mut);align-self:center;text-align:center}
.ad{display:block;width:calc(100% - 2px);margin:1px;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--surf));color:var(--ink);font-size:.68rem;text-align:left;padding:1px 3px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad.x{opacity:.55;text-decoration:line-through}
.scr{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-top:6px}
.tl{display:grid;height:calc(24*44px)}
.gut{position:relative}
.gut span{position:absolute;right:4px;font-size:.66rem;color:var(--mut)}
.tc{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.blk{position:absolute;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--surf));color:var(--ink);text-align:left;font-size:.68rem;line-height:1.15;padding:2px 3px;border-radius:5px;overflow:hidden;outline:1px solid var(--surf);display:flex;flex-direction:column}
.blk b{font-weight:600;overflow:hidden}
.blk span{color:var(--mut)}
.blk.x{opacity:.55;text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:2px;background:#e5484d;z-index:2;pointer-events:none}
.ag{display:flex;gap:8px}
.ag input{flex:1;min-width:0}
.yg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.yg{grid-template-columns:repeat(3,1fr)}}
.mini{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px}
.mt{border:0;background:none;font-weight:700;padding:2px 0 6px;font-size:.95rem}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.mg .w{font-size:.6rem;color:var(--mut)}
.mg button{border:0;background:none;font-size:.7rem;padding:3px 0;border-radius:50%;aspect-ratio:1;min-height:0}
.mg .b{background:var(--wash);color:var(--acc);font-weight:700}
.mg .today{background:var(--acc);color:var(--accink);font-weight:700}
.hero{position:relative;margin:-12px -12px 14px;padding:26px 20px 84px;border-radius:0 0 26px 26px;overflow:hidden;color:#fff;background:linear-gradient(180deg,#141a4d 0%,#4a2a82 40%,#c4497a 72%,#f59a4a 100%)}
.hero svg.mtn{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:55%}
.hero h2{position:relative;margin:0;font-size:2rem;letter-spacing:-.02em}
.hero p{position:relative;margin:2px 0 0;opacity:.92}
.gl{position:absolute;right:16px;top:24px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);display:grid;place-items:center}
.gl svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:12px 10px}
.bn{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:6px 4px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bn button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mut);min-height:52px;position:relative;justify-content:center}
.bn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn button.on{color:var(--acc)}
.bn button.on::after{content:"";position:absolute;bottom:-2px;width:34px;height:3px;border-radius:2px;background:var(--acc)}
.bn .soon{opacity:.55}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bgi{position:absolute;inset:0;background-repeat:no-repeat}
.hasimg #bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--scr1),var(--scr2))}
.hasimg .hero{background:linear-gradient(180deg,var(--glow),transparent);color:var(--ink);padding-bottom:30px}
.hasimg .hero svg.mtn{display:none}
.card,ul,.bn{backdrop-filter:blur(var(--blur,0px));-webkit-backdrop-filter:blur(var(--blur,0px))}
.pv{position:relative;aspect-ratio:9/16;max-height:36vh;margin:0 auto 10px;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.pv.w{aspect-ratio:16/9;max-height:none}
.pv>div{position:absolute;inset:0;background-repeat:no-repeat}
.pv span{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;color:var(--mut);padding:8px;text-align:center}
input[type=range]{border:0;background:none;padding:0;min-height:32px;accent-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="bg"><div id="bgi"></div></div>
<div id="app">
  <section class="hero" id="hero">
    <svg class="mtn" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true"><circle cx="292" cy="46" r="7" fill="#ffc36b"/><path d="M0 70L50 40L90 62L150 28L210 60L270 35L330 58L400 30V100H0Z" fill="#3b2a6b" opacity=".85"/><path d="M0 86L60 64L120 80L190 56L260 78L330 62L400 82V100H0Z" style="fill:var(--bg)"/></svg>
    <h2>Olá!</h2><p id="hDate"></p>
    <button class="gl" id="hSearch" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </section>
  <header>
    <button class="ib" id="prev" aria-label="Mês anterior">‹</button>
    <h1 id="title"></h1>
    <button class="ib" id="next" aria-label="Próximo mês">›</button>
    <button class="hoje" id="hoje">Hoje</button>
  </header>
  <div id="v-mes">
    <div class="card"><div class="dow" id="dow"></div><div class="grid" id="grid"></div></div>
    <h2 id="dayTitle"></h2>
    <ul id="dayList"></ul>
    <h2>Próximos compromissos</h2>
    <ul id="upList"></ul>
  </div>
  <div id="v-sem" hidden></div>
  <div id="v-dia" hidden></div>
  <div id="v-ag" hidden><div class="ag"><input id="busca" type="search" placeholder="Buscar título, local ou descrição" aria-label="Buscar na agenda" autocomplete="off"><button class="hoje" id="pass">Mostrar passados</button></div><div id="agList"></div></div>
  <div id="v-ano" hidden></div>
  <div id="v-cfg" hidden>
    <h2>Aparência</h2>
    <div class="card">
      <div class="pv w"><div id="pvIn"></div><span id="pvTxt">Sem imagem. Usando o tema padrão.</span></div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="acts"><button class="p" id="cPick">Escolher imagem</button><button id="cAdj">Ajustar</button><button class="d" id="cRem">Remover</button></div>
      <label class="chk"><input type="checkbox" id="cAd"> Adaptar cores à imagem</label>
      <label for="cInt">Intensidade da paleta</label><input type="range" id="cInt" min="0" max="100">
      <label for="cOp">Opacidade dos cartões (com imagem)</label><input type="range" id="cOp" min="40" max="100">
      <div class="row"><div><label for="cAc">Cor de destaque</label><input type="color" id="cAc"></div><div><label for="cMod">Tema</label><select id="cMod"><option value="escuro">Escuro</option><option value="claro">Claro</option><option value="auto">Automático</option></select></div></div>
      <p class="empty" id="ctr"></p>
      <div class="acts"><button id="cAuto">Destaque automático</button><button class="d" id="cRes">Restaurar padrão</button></div>
    </div>
  </div>
</div>
<nav class="bn" aria-label="Navegação principal">
  <button data-v="mes"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calendário</button>
  <button data-v="ag"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Agenda</button>
  <button data-a="tarefas" class="soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Tarefas</button>
  <button data-a="pesq"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Pesquisa</button>
  <button data-a="mais"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Mais</button>
</nav>
<button id="fab" aria-label="Novo evento">+</button>

<div class="ov" id="ovForm" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <h3 id="fTitle">Novo evento</h3>
    <label for="fNome">Título</label>
    <input id="fNome" maxlength="120" autocomplete="off">
    <label class="chk"><input type="checkbox" id="fDia"> Dia inteiro</label>
    <div class="row">
      <div><label for="fD1">Início</label><input type="date" id="fD1"></div>
      <div id="wH1"><label for="fH1">Hora</label><input type="time" id="fH1"></div>
    </div>
    <div class="row">
      <div><label for="fD2">Término</label><input type="date" id="fD2"></div>
      <div id="wH2"><label for="fH2">Hora</label><input type="time" id="fH2"></div>
    </div>
    <label for="fLoc">Localização</label>
    <input id="fLoc" maxlength="160">
    <label for="fDesc">Descrição</label>
    <textarea id="fDesc" rows="3"></textarea>
    <div class="row">
      <div><label for="fCat">Categoria</label><select id="fCat"></select></div>
      <div><label for="fCor">Cor</label><input type="color" id="fCor"></div>
    </div>
    <div class="row">
      <div><label for="fPri">Prioridade</label>
        <select id="fPri"><option value="baixa">Baixa</option><option value="normal" selected>Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
      <div><label for="fEst">Estado</label>
        <select id="fEst"><option value="planejado">Planejado</option><option value="confirmado">Confirmado</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select></div>
    </div>
    <div id="err" role="alert"></div>
    <div class="acts">
      <button class="p" id="bSalvar">Salvar</button>
      <button id="bDup" hidden>Duplicar</button>
      <button class="d" id="bDel" hidden>Excluir</button>
      <button id="bFechar">Cancelar</button>
    </div>
  </div>
</div>

<div class="ov" id="ovConf" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true">
    <h3>Excluir evento?</h3>
    <p id="cTxt" style="margin:0;color:var(--mut)"></p>
    <div class="acts"><button class="d" id="cSim">Excluir</button><button id="cNao">Manter</button></div>
  </div>
</div>
<div class="ov" id="ovMais" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>Mais visões</h3>
    <div class="acts"><button data-v="sem">Semana</button><button data-v="dia">Dia</button><button data-v="ano">Ano</button><button data-v="cfg">Configurações</button></div>
    <div class="acts"><button data-x="1">Fechar</button></div>
  </div>
</div>
<div class="ov" id="ovImg" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>Ajustar imagem</h3>
    <div class="pv"><div id="pv2In"></div></div>
    <label for="iFit">Enquadramento</label><select id="iFit"><option value="cover">Preencher a tela</option><option value="contain">Mostrar inteira</option></select>
    <label for="iZ">Zoom</label><input type="range" id="iZ" min="100" max="250">
    <div class="row"><div><label for="iX">Horizontal</label><input type="range" id="iX" min="0" max="100"></div><div><label for="iY">Vertical</label><input type="range" id="iY" min="0" max="100"></div></div>
    <div class="acts"><button class="p" id="iOk">Aplicar</button><button id="iNo">Cancelar</button></div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
const MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const CATS=[["pessoal","Pessoal","#3b82c4"],["trabalho","Trabalho","#7a5cc7"],["estudos","Estudos","#d98a1f"],["saude","Saúde","#2e9e6b"],["familia","Família","#d1568a"],["lazer","Lazer","#1fa3b5"],["financas","Finanças","#6f8f2a"],["outros","Outros","#7b8794"]];
const PRI={baixa:"Baixa",normal:"Normal",alta:"Alta",urgente:"Urgente"};
const EST={planejado:"Planejado",confirmado:"Confirmado",concluido:"Concluído",cancelado:"Cancelado"};
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const br=s=>s.split("-").reverse().join("/");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"id-"+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};

/* ---------- Banco de dados (IndexedDB) ---------- */
let db=null,cats=[],events=[];
const openDB=()=>new Promise((res,rej)=>{
  const r=indexedDB.open("calendario",1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("events",{keyPath:"id"});d.createObjectStore("categories",{keyPath:"id"});d.createObjectStore("settings",{keyPath:"key"})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("bloqueado"));
});
const tx=(st,mode,fn)=>new Promise((res,rej)=>{
  const t=db.transaction(st,mode),q=fn(t.objectStore(st));
  t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
});
const dbAll=st=>tx(st,"readonly",o=>o.getAll());
const dbPut=(st,v)=>tx(st,"readwrite",o=>o.put(v));
const dbDel=(st,id)=>tx(st,"readwrite",o=>o.delete(id));

/* ---------- Estado ---------- */
const now0=new Date();
let todayK=fmt(now0),sel=todayK,vy=now0.getFullYear(),vm=now0.getMonth(),editing=null,dbOk=false;
const cat=id=>cats.find(c=>c.id===id)||{id:"outros",nome:"Outros",cor:"#7b8794"};
const col=e=>e.color||cat(e.categoryId).cor;

/* ---------- Regras de data ---------- */
function lastDay(e){ // último dia que o evento ocupa (termina à meia-noite exata não ocupa o dia seguinte)
  if(!e.allDay&&e.endTime==="00:00"&&e.endDate>e.startDate)return addDays(e.endDate,-1);
  return e.endDate;
}
const covers=(e,k)=>e.startDate<=k&&k<=lastDay(e);
function on(k){
  return events.filter(e=>covers(e,k)).sort((a,b)=>{
    if(a.allDay!==b.allDay)return a.allDay?-1:1;
    const ta=a.startDate<k?"00:00":a.startTime,tb=b.startDate<k?"00:00":b.startTime;
    return ta<tb?-1:ta>tb?1:a.title.localeCompare(b.title,"pt-BR");
  });
}
function when(e,k){
  if(e.allDay)return e.startDate===e.endDate?"Dia inteiro":"Dia inteiro, "+br(e.startDate)+" a "+br(e.endDate);
  if(e.startDate!==e.endDate)return br(e.startDate)+" "+e.startTime+" a "+br(e.endDate)+" "+e.endTime;
  return e.startTime+" às "+e.endTime;
}

/* ---------- Renderização ---------- */
function item(e,k,showDate){
  const chips=(e.priority!=="normal"?`<span class="chip${e.priority==="urgente"?" u":""}">${PRI[e.priority]}</span>`:"")+(e.status!=="planejado"?`<span class="chip">${EST[e.status]}</span>`:"");
  const tm=e.allDay?"Dia todo":(e.startDate<k?"00:00":e.startTime),multi=e.startDate!==e.endDate;
  return `<li><button class="ev${e.status==="cancelado"?" x":""}" data-id="${esc(e.id)}"><span class="bar" style="background:${esc(col(e))}"></span><span class="tm">${esc(tm)}</span><span class="bd"><span class="t">${esc(e.title)}</span><span class="m">${showDate?`<span>${br(e.startDate)}</span>`:""}${multi?`<span>${esc(when(e,k))}</span>`:""}${e.location?`<span>${esc(e.location)}</span>`:""}<span>${esc(cat(e.categoryId).nome)}</span></span>${chips?`<span class="m cp">${chips}</span>`:""}</span><span class="chev">›</span></button></li>`;
}
function renderMes(){
  const off=(new Date(vy,vm,1).getDay()+6)%7;
  let h="";
  for(let i=0;i<42;i++){
    const d=new Date(vy,vm,1-off+i),k=fmt(d),ev=on(k);
    h+=`<button class="cell${d.getMonth()!==vm?" out":""}${k===todayK?" today":""}${k===sel?" sel":""}" data-d="${k}" aria-label="${d.getDate()} de ${MES[d.getMonth()]}${ev.length?", "+ev.length+(ev.length>1?" eventos":" evento"):""}"><span class="n">${d.getDate()}</span><span class="dots">${ev.slice(0,3).map(e=>`<i style="background:${esc(col(e))}"></i>`).join("")}${ev.length>3?`<b>+${ev.length-3}</b>`:""}</span></button>`;
  }
  $("#grid").innerHTML=h;
  const sd=parse(sel);
  $("#dayTitle").textContent=(sel===todayK?"Hoje, ":"")+sd.getDate()+" de "+MES[sd.getMonth()]+" de "+sd.getFullYear();
  const de=on(sel);
  $("#dayList").innerHTML=de.length?de.map(e=>item(e,sel,false)).join(""):`<li class="empty">Nenhum evento neste dia. Toque em + para criar um.</li>`;
  const n=new Date(),nk=fmt(n)+" "+p2(n.getHours())+":"+p2(n.getMinutes());
  const up=events.filter(e=>e.status!=="cancelado"&&e.status!=="concluido"&&(e.endDate+" "+(e.allDay?"23:59":e.endTime))>=nk)
    .sort((a,b)=>(a.startDate+(a.allDay?"00:00":a.startTime))<(b.startDate+(b.allDay?"00:00":b.startTime))?-1:1).slice(0,5);
  $("#upList").innerHTML=up.length?up.map(e=>item(e,e.startDate,true)).join(""):`<li class="empty">Sem compromissos futuros.</li>`;
}
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
function goto(k){sel=k;const d=parse(k);vy=d.getFullYear();vm=d.getMonth();render()}

/* ---------- Visões ---------- */
let view="mes",verPassados=false,busca="";
const MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DIAF=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const HH=44;
const tmin=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const wkStart=k=>addDays(k,-((parse(k).getDay()+6)%7));
function seg(e,k){const s=e.startDate<k?0:tmin(e.startTime);let en=e.endDate>k?1440:tmin(e.endTime);if(en<s+30)en=Math.min(s+30,1440);return{e,s,en}}

  it.sort((a,b)=>a.s-b.s||b.en-a.en);const out=[];let cl=[],ce=0;
  const fl=()=>{const n=Math.max(...cl.map(x=>x.c))+1;cl.forEach(x=>x.n=n);out.push(...cl);cl=[]};
  for(const x of it){if(cl.length&&x.s>=ce)fl();let c=0;while(cl.some(y=>y.c===c&&y.en>x.s))c++;x.c=c;cl.push(x);ce=cl.length===1?x.en:Math.max(ce,x.en)}

}
function colHtml(k,compact){
  let h=lay(on(k).filter(e=>!e.allDay).map(e=>seg(e,k))).map(x=>{const e=x.e;
    return `<button class="blk${e.status==="cancelado"?" x":""}" data-id="${esc(e.id)}" style="top:${x.s/60*HH}px;height:${Math.max((x.en-x.s)/60*HH-1,18)}px;left:${x.c/x.n*100}%;width:${100/x.n}%;--c:${esc(col(e))}"><b>${esc(e.title)}</b>${compact?"":`<span>${esc(when(e,k))}</span>`}</button>`}).join("");

function timeline(days,compact){

  return `<div class="scr"><div class="tl" style="grid-template-columns:34px repeat(${days.length},1fr)"><div class="gut">${g}</div>${days.map(k=>`<div class="tc">${colHtml(k,compact)}</div>`).join("")}</div></div>`;
}
function adRow(days){
  if(!days.some(k=>on(k).some(e=>e.allDay)))return "";

function scrollTL(id,days){const sc=$(id+" .scr");if(sc)sc.scrollTop=(days.includes(todayK)?Math.max(new Date().getHours()-1,0):7)*HH}
function renderSem(){
  const s=wkStart(sel),days=[0,1,2,3,4,5,6].map(i=>addDays(s,i));
  const wh=`<div class="wh" style="grid-template-columns:34px repeat(7,1fr)"><span></span>${days.map(k=>{const d=parse(k);return `<button data-day="${k}" class="${k===todayK?"today ":""}${k===sel?"sel":""}" aria-label="${d.getDate()} de ${MES[d.getMonth()]}"><small>${DIAS[(d.getDay()+6)%7]}</small><b>${d.getDate()}</b></button>`}).join("")}</div>`;
  $("#v-sem").innerHTML=wh+adRow(days)+timeline(days,true);
  scrollTL("#v-sem",days);
}
function renderDia(){
  const ev=on(sel),ad=ev.filter(e=>e.allDay);
  $("#v-dia").innerHTML=(ad.length?`<ul>${ad.map(e=>item(e,sel,false)).join("")}</ul>`:"")+(ev.length?"":`<p class="empty">Nenhum evento neste dia. Toque em + para criar um.</p>`)+timeline([sel],false);
  scrollTL("#v-dia",[sel]);
}
function renderAg(){
  const q=busca.trim().toLowerCase();
  const key=e=>e.startDate+(e.allDay?"00:00":e.startTime);
  const list=events.filter(e=>(verPassados||lastDay(e)>=todayK)&&(!q||(e.title+" "+e.description+" "+e.location).toLowerCase().includes(q))).sort((a,b)=>key(a)<key(b)?-1:1);
  const g=[];list.forEach(e=>{const l=g[g.length-1];if(l&&l.k===e.startDate)l.l.push(e);else g.push({k:e.startDate,l:[e]})});
  $("#pass").textContent=verPassados?"Ocultar passados":"Mostrar passados";
  $("#agList").innerHTML=g.length?g.map(x=>`<h2>${x.k===todayK?"Hoje, ":""}${DIAS[(parse(x.k).getDay()+6)%7]}, ${br(x.k)}</h2><ul>${x.l.map(e=>item(e,x.k,false)).join("")}</ul>`).join(""):`<p class="empty">${q?"Nenhum resultado para a busca.":"Nenhum evento futuro. Toque em + para criar um."}</p>`;
}
function renderAno(){
  const busy=new Set(),y0=vy+"-01-01",y1=vy+"-12-31";
  events.forEach(e=>{const z=lastDay(e)>y1?y1:lastDay(e);for(let k=e.startDate<y0?y0:e.startDate;k<=z;k=addDays(k,1))busy.add(k)});
  let h="";
  for(let m=0;m<12;m++){
    const off=(new Date(vy,m,1).getDay()+6)%7,n=new Date(vy,m+1,0).getDate();
    h+=`<div class="mini"><button class="mt" data-mes="${m}">${MES[m]}</button><div class="mg">`+DIAS.map(d=>`<span class="w">${d[0]}</span>`).join("")+"<span></span>".repeat(off);
    for(let d=1;d<=n;d++){const k=vy+"-"+p2(m+1)+"-"+p2(d);h+=`<button data-day="${k}" class="${k===todayK?"today":busy.has(k)?"b":""}">${d}</button>`}
    h+="</div></div>";
  }
  $("#v-ano").innerHTML=`<div class="yg">${h}</div>`;
}
function render(){
  const T={mes:MES[vm]+" de "+vy,ag:"Agenda",cfg:"Configurações",ano:String(vy)};
  if(view==="sem"){const a=parse(wkStart(sel)),b=parse(addDays(wkStart(sel),6));T.sem=a.getDate()+(a.getMonth()!==b.getMonth()?" "+MS[a.getMonth()]:"")+" a "+b.getDate()+" "+MS[b.getMonth()]+" "+b.getFullYear()}
  if(view==="dia"){const d=parse(sel);T.dia=DIAF[d.getDay()]+", "+d.getDate()+" de "+MS[d.getMonth()]}
  $("#title").textContent=T[view];
  ["mes","sem","dia","ag","ano","cfg"].forEach(v=>$("#v-"+v).hidden=v!==view);
  document.querySelectorAll(".bn button").forEach(b=>b.classList.toggle("on",b.dataset.v===view||(b.dataset.a==="mais"&&["sem","dia","ano","cfg"].includes(view))));
  $("#hero").hidden=view!=="mes";
  const n0=new Date();$("#hDate").textContent=DIAF[n0.getDay()]+", "+n0.getDate()+" de "+MES[n0.getMonth()]+" de "+n0.getFullYear();
  $("#prev").style.visibility=$("#next").style.visibility=view==="ag"||view==="cfg"?"hidden":"visible";
  ({mes:renderMes,sem:renderSem,dia:renderDia,ag:renderAg,ano:renderAno,cfg:renderCfg})[view]();
}
function nav(n){
  if(view==="sem")return goto(addDays(sel,7*n));
  if(view==="dia")return goto(addDays(sel,n));
  if(view==="ano")vy+=n;
  else{vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}}
  render();
}

/* ---------- Formulário ---------- */
function syncDia(){const a=$("#fDia").checked;$("#wH1").style.display=$("#wH2").style.display=a?"none":""}
function openForm(ev){
  const novo=!ev||!ev.id;editing=novo?null:ev;
  $("#fTitle").textContent=novo?(ev?"Duplicar evento":"Novo evento"):"Editar evento";
  let e=ev;
  if(!e){
    const n=new Date(),h=(sel===todayK)?Math.min(n.getHours()+1,23):9,hf=Math.min(h+1,23);
    e={title:"",allDay:false,startDate:sel,startTime:p2(h)+":00",endDate:sel,endTime:h===23?"23:59":p2(hf)+":00",location:"",description:"",categoryId:"pessoal",color:null,priority:"normal",status:"planejado"};
  }
  $("#fCat").innerHTML=cats.map(c=>`<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join("");
  $("#fNome").value=e.title;$("#fDia").checked=!!e.allDay;
  $("#fD1").value=e.startDate;$("#fH1").value=e.startTime;$("#fD2").value=e.endDate;$("#fH2").value=e.endTime;
  $("#fLoc").value=e.location||"";$("#fDesc").value=e.description||"";
  $("#fCat").value=e.categoryId;$("#fCor").value=e.color||cat(e.categoryId).cor;
  $("#fPri").value=e.priority;$("#fEst").value=e.status;
  $("#bDup").hidden=$("#bDel").hidden=novo||!!(ev&&!ev.id);
  $("#err").textContent="";syncDia();$("#ovForm").hidden=false;
  setTimeout(()=>{if(novo)$("#fNome").focus()},50);
}
const closeForm=()=>{$("#ovForm").hidden=true;editing=null};
async function save(){
  const t=$("#fNome").value.trim(),allDay=$("#fDia").checked,sd=$("#fD1").value,ed=$("#fD2").value;
  let st=$("#fH1").value,et=$("#fH2").value;
  const err=m=>{$("#err").textContent=m};
  if(!t)return err("Digite um título para o evento.");
  if(!sd||!ed)return err("Informe a data de início e a de término.");
  if(allDay){st="00:00";et="23:59"}
  else if(!st||!et)return err("Informe o horário de início e o de término.");
  if(ed<sd)return err("A data de término não pode ser anterior ao início.");
  if(!allDay&&ed===sd&&et<st)return err("O término precisa ser depois do início. Para atravessar a meia-noite, escolha o dia seguinte no término.");
  if(!dbOk)return err("O armazenamento do navegador não está disponível. Não foi possível salvar.");
  const agora=Date.now(),base=editing||{id:uid(),createdAt:agora};
  const ev={...base,title:t,description:$("#fDesc").value.trim(),allDay,startDate:sd,startTime:st,endDate:ed,endTime:et,location:$("#fLoc").value.trim(),categoryId:$("#fCat").value,color:$("#fCor").value,priority:$("#fPri").value,status:$("#fEst").value,updatedAt:agora};
  try{
    await dbPut("events",ev);
    events=await dbAll("events");
    const was=!!editing;closeForm();goto(sd);toast(was?"Evento atualizado.":"Evento salvo.");
  }catch(e){err("Não foi possível salvar. Tente novamente.")}
}
function askDelete(){
  $("#cTxt").textContent="“"+editing.title+"” será removido permanentemente.";$("#ovConf").hidden=false;
}
async function doDelete(){
  try{
    await dbDel("events",editing.id);events=await dbAll("events");
    $("#ovConf").hidden=true;closeForm();render();toast("Evento excluído.");
  }catch(e){$("#ovConf").hidden=true;toast("Não foi possível excluir.")}
}

$("#dayList").onclick=openById;$("#upList").onclick=openById;
$("#bSalvar").onclick=save;$("#bFechar").onclick=closeForm;

$("#bDel").onclick=askDelete;$("#cNao").onclick=()=>$("#ovConf").hidden=true;$("#cSim").onclick=doDelete;
$("#fDia").onchange=syncDia;
$("#fCat").onchange=()=>$("#fCor").value=cat($("#fCat").value).cor;
$("#fD1").onchange=()=>{if(!$("#fD2").value||$("#fD2").value<$("#fD1").value)$("#fD2").value=$("#fD1").value};

  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const q=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4),o=b[q]||(b[q]={n:0,r:0,g:0,b:0});o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2]}
  let tn=0,ts=0;
  const l=Object.values(b).map(o=>{const h=rgb2hsl(o.r/o.n,o.g/o.n,o.b/o.n);tn+=o.n;ts+=o.n*h[1];return{h:h[0],s:h[1],l:h[2],n:o.n}});
  l.forEach(o=>o.sc=o.n*(.3+o.s)*(1-Math.abs(o.l-.5)));
  l.sort((a,b)=>b.sc-a.sc);
  const out=[];for(const o of l){if(out.every(p=>Math.min(Math.abs(p.h-o.h),360-Math.abs(p.h-o.h))>25))out.push(o);if(out.length===3)break}
  return{c:out.map(o=>[Math.round(o.h),+o.s.toFixed(2),+o.l.toFixed(2)]),sat:+(ts/Math.max(tn,1)).toFixed(2)};
}
const TDEF={mode:"escuro",adapt:true,intensity:60,opacity:80,accent:null,hasImg:false,fit:"cover",zoom:100,x:50,y:50,dom:null};
let tema={...TDEF},imgUrl=null,pend=null,tSave=0,lastCr=21;
function frame(el,url,f){el.style.cssText=`background-image:url("${url}");background-size:${f.fit};background-position:${f.x}% ${f.y}%;transform-origin:${f.x}% ${f.y}%;transform:scale(${f.zoom/100})`}
function applyTheme(){
  const r=document.documentElement,t=tema,img=t.hasImg&&imgUrl;
  r.classList.toggle("hasimg",!!img);
  if(img)frame($("#bgi"),imgUrl,t);else $("#bgi").style.cssText="";
  const dark=t.mode==="escuro"||(t.mode==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  const P=tokens(t,dark);lastCr=P.cr;
  if(!t.dom&&!t.accent&&dark)Object.keys(P.vars).forEach(k=>r.style.removeProperty(k)); // padrão: mantém o visual original
  else Object.entries(P.vars).forEach(([k,v])=>r.style.setProperty(k,v));
  r.style.colorScheme=dark?"dark":"light";
  if(view==="cfg")renderCfg();
}
function saveTema(){clearTimeout(tSave);tSave=setTimeout(()=>{if(dbOk)dbPut("settings",{key:"tema",...tema}).catch(()=>{})},250)}
async function loadTema(){
  try{
    const t=await tx("settings","readonly",o=>o.get("tema"));
    if(t){delete t.key;tema={...TDEF,...t}}
    if(tema.hasImg){const b=await tx("settings","readonly",o=>o.get("tema-img"));if(b&&b.blob)imgUrl=URL.createObjectURL(b.blob);else tema.hasImg=false}
  }catch(e){}
  applyTheme();
}
function renderCfg(){
  const set=(id,k,v)=>{const el=$(id);if(el!==document.activeElement)el[k]=v};
  set("#cAd","checked",tema.adapt);set("#cInt","value",tema.intensity);set("#cOp","value",tema.opacity);set("#cMod","value",tema.mode);
  const ac=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim();set("#cAc","value",/^#[0-9a-f]{6}$/i.test(ac)?ac:"#2f7bff");
  const has=tema.hasImg&&imgUrl;
  if(has)frame($("#pvIn"),imgUrl,tema);else $("#pvIn").style.cssText="";
  $("#pvTxt").hidden=!!has;
  $("#ctr").textContent="Contraste do texto com o fundo: "+lastCr.toFixed(1)+":1 ("+(lastCr>=7?"excelente":lastCr>=4.5?"bom":"baixo")+").";
}
async function pick(file){
  try{
    const bmp=await createImageBitmap(file),sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    const x=c.getContext("2d");x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.86));
    if(pend&&pend.blob)URL.revokeObjectURL(pend.url);
    pend={blob,url:URL.createObjectURL(blob),dom:dominantes(c),f:{fit:"cover",zoom:100,x:50,y:50}};
    openImg();
  }catch(e){toast("Não foi possível ler esta imagem.")}
}
function openImg(){const f=pend.f;$("#iFit").value=f.fit;$("#iZ").value=f.zoom;$("#iX").value=f.x;$("#iY").value=f.y;frame($("#pv2In"),pend.url,f);$("#ovImg").hidden=false}
function closeImg(){if(pend&&pend.blob)URL.revokeObjectURL(pend.url);pend=null;$("#ovImg").hidden=true}
async function aplicar(){
  const p=pend;if(!p)return;
  if(p.blob){
    try{if(dbOk)await dbPut("settings",{key:"tema-img",blob:p.blob})}catch(e){return toast("Não foi possível guardar a imagem.")}
    if(imgUrl&&imgUrl!==p.url)URL.revokeObjectURL(imgUrl);imgUrl=p.url;tema.dom=p.dom;
  }
  Object.assign(tema,p.f,{hasImg:true});pend=null;$("#ovImg").hidden=true;
  saveTema();applyTheme();toast("Imagem aplicada.");
}
async function remover(){
  try{if(dbOk)await dbDel("settings","tema-img")}catch(e){}
  if(imgUrl)URL.revokeObjectURL(imgUrl);imgUrl=null;Object.assign(tema,{hasImg:false,dom:null,fit:"cover",zoom:100,x:50,y:50});
}
const setT=(k,v)=>{tema[k]=v;saveTema();applyTheme()};
$("#cPick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)pick(f)};
$("#cAdj").onclick=()=>{if(!imgUrl)return toast("Escolha uma imagem primeiro.");pend={blob:null,url:imgUrl,dom:tema.dom,f:{fit:tema.fit,zoom:tema.zoom,x:tema.x,y:tema.y}};openImg()};
$("#cRem").onclick=async()=>{await remover();saveTema();applyTheme();toast("Imagem removida.")};
$("#cRes").onclick=async()=>{await remover();tema={...TDEF};saveTema();applyTheme();toast("Aparência restaurada.")};
$("#cAd").onchange=e=>setT("adapt",e.target.checked);
$("#cInt").oninput=e=>setT("intensity",+e.target.value);
$("#cOp").oninput=e=>setT("opacity",+e.target.value);
$("#cAc").oninput=e=>setT("accent",e.target.value);
$("#cAuto").onclick=()=>setT("accent",null);
$("#cMod").onchange=e=>setT("mode",e.target.value);
[["#iFit","fit",v=>v],["#iZ","zoom",Number],["#iX","x",Number],["#iY","y",Number]].forEach(([id,k,fn])=>$(id).oninput=e=>{pend.f[k]=fn(e.target.value);frame($("#pv2In"),pend.url,pend.f)});
$("#iOk").onclick=aplicar;$("#iNo").onclick=closeImg;
["(prefers-color-scheme: dark)","(prefers-contrast: more)","(prefers-reduced-transparency: reduce)"].forEach(q=>matchMedia(q).addEventListener("change",applyTheme));

(async()=>{
  try{
    db=await openDB();
    cats=await dbAll("categories");
    if(!cats.length){for(const c of CATS)await dbPut("categories",{id:c[0],nome:c[1],cor:c[2],arquivada:false});cats=await dbAll("categories")}
    events=await dbAll("events");dbOk=true;await loadTema();
  }catch(e){
    cats=CATS.map(c=>({id:c[0],nome:c[1],cor:c[2]}));
    toast("Armazenamento indisponível: os eventos não serão salvos.");
  }
  render();
})();
